[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hopcopter-model"
version = "0.1.0"
description = "Stance-phase dynamics and landing-to-takeoff mapping of the Hopcopter (paper Eqs. 12-21), ported from the authors' MATLAB code."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
